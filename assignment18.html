<!DOCTYPE html>
<html lang="en">
<head>
    <title>ABC College Admission 2026</title>
</head>
<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <h2>Courses and Fees</h2>

    <table border="1" cellpadding="5" cellspacing="0">
        <caption>Available Courses</caption>

        <tr>
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>
        </tr>

        <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>₹90,000</td>
        </tr>

        <tr>
            <td>BCA</td>
            <td>60</td>
            <td>₹45,000</td>
        </tr>
    </table>

    <br>

    <form action="submit.php" method="post">

        <fieldset>
            <legend>Application Form</legend>

            <label for="name">Name:</label>
            <br>
            <input type="text" id="name"
                   name="name" required>
            <br><br>

            <label for="email">Email:</label>
            <br>
            <input type="email" id="email"
                   name="email" required>
            <br><br>

            <label for="course">Course:</label>
            <br>

            <select id="course" name="course" required>
                <option value="B.Tech CSE">B.Tech CSE</option>
                <option value="BCA">BCA</option>
            </select>

            <br><br>

            <label for="statement">Statement:</label>
            <br>

            <textarea id="statement" name="statement"
                      rows="4" cols="35"
                      required></textarea>

            <br><br>

            <input type="submit" value="Apply">

        </fieldset>

    </form>

    <br>

    <footer>
        <p>© 2026 ABC College</p>
         <p>created by saksham chauhan</p>
    </footer>

</body>
</html>
