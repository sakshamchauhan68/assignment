<!DOCTYPE html>
<html>
<head>
    <title>Assignment 17</title>
</head>
<body>



    <form method="post" action="submit.php">

        <input type="text"
               name="fullname"
               placeholder="Full name"
               required>
        <br><br>

        <input type="email"
               name="email"
               placeholder="you@college.edu"
               required>
        <br><br>

        <input type="tel"
               name="mobile"
               placeholder="10-digit mobile"
               pattern="[0-9]{10}"
               title="Enter exactly 10 digits"
               required>
        <br><br>

        <input type="password"
               name="password"
               placeholder="Min 6 characters"
               minlength="6"
               required>
        <br><br>

        <input type="number"
               name="age"
               placeholder="Age (18-30)"
               min="18"
               max="30"
               required>
        <br><br>

        <input type="submit" value="Register">

    </form>
<footer>
        created by saksham chauhan
    </footer>
</body>
</html>
