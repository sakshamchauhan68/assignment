<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Assignment</title>
</head>
<body>

    <h2>Image</h2>

    <p>College campus</p>

        <table border="1" cellpadding="5">
        <tr>
            <td width="170" height="150">
                <img src="college.jpg"
                     alt="College Campus"
                     width="160"
                     height="140">
            </td>
        </tr>
    </table>
  

    <h2>Video</h2>

    <video width="300" height="150" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <h2>Audio</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <h2>YouTube</h2>

    <iframe
        width="350"
        height="200"
        src="https://www.youtube.com/embed/VIDEO_ID"
        allowfullscreen>
    </iframe>
<footer>
        created by saksham chauhan
    </footer>
</body>
</html>
