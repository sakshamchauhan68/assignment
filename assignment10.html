<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Example</title>
</head>
<body>

    <h2>Image</h2>
    College campus<br>
    <img src="college.jpg" alt="College Campus" width="300" height="200">

    <h2>Video</h2>
    <video width="300" controls>
        <source src="video.mp4" type="video/mp4">
        
    </video>

    <h2>Audio</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    
    </audio>

    <h2>YouTube</h2>
    <iframe width="300" height="200"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video"
        allowfullscreen>
    </iframe>
    <footer>
        created by saksham chauhan
    </footer>
</body>
</html>
